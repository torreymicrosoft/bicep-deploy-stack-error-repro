# Re-run of the repro pinned to azure/bicep-deploy @ 01859ee (PR #360 "Fix error reporting", head of ant/testing),
# as Anthony Martin asked on 2026-10-23. main still pins 7443f92 (PR #327) for issues #358 and #350.
# #360 also moves deployments to @azure/arm-resourcesdeployments 2.0.0, so step 4 is no longer a control, and
# steps 5 to 7 cover the other operations #360 changes.
# No Azure credentials are involved. A stand-in `az` supplies a dummy token and the subscription ID is all zeros,
# so Azure Resource Manager rejects the first request with 400 InvalidSubscriptionId. Compare each step's error annotation.
name: Repro - stack errors (bicep-deploy 01859ee, PR 360)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    env:
      SUB: 00000000-0000-0000-0000-000000000000
      RG: repro-rg
    steps:
      - name: Setup - empty template + stand-in az that returns an invalid token
        run: |
          echo '{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#","contentVersion":"1.0.0.0","resources":[]}' > main.json
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/az" <<'EOF'
          #!/bin/sh
          echo '{"accessToken":"invalid-token-for-repro","expires_on":1893456000,"expiresOn":"2030-01-01 00:00:00.000000","tokenType":"Bearer"}'
          EOF
          chmod +x "$RUNNER_TEMP/bin/az"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: 1 stack whatIf @01859ee (PR 360)
        if: always()
        uses: azure/bicep-deploy@01859ee1fa3dd81eca9f2fe88da19faf52a0b532
        with:
          type: deploymentStack
          operation: whatIf
          name: repro-stack
          scope: resourceGroup
          subscription-id: ${{ env.SUB }}
          resource-group-name: ${{ env.RG }}
          template-file: main.json
          action-on-unmanage-resources: delete
          deny-settings-mode: none

      - name: 2 stack create @01859ee (PR 360)
        if: always()
        uses: azure/bicep-deploy@01859ee1fa3dd81eca9f2fe88da19faf52a0b532
        with:
          type: deploymentStack
          operation: create
          name: repro-stack
          scope: resourceGroup
          subscription-id: ${{ env.SUB }}
          resource-group-name: ${{ env.RG }}
          template-file: main.json
          action-on-unmanage-resources: delete
          deny-settings-mode: none

      - name: 3 control - stack create @v2 (released)
        if: always()
        uses: azure/bicep-deploy@v2
        with:
          type: deploymentStack
          operation: create
          name: repro-stack
          scope: resourceGroup
          subscription-id: ${{ env.SUB }}
          resource-group-name: ${{ env.RG }}
          template-file: main.json
          action-on-unmanage-resources: delete
          deny-settings-mode: none

      - name: 4 deployment whatIf @01859ee (PR 360)
        if: always()
        uses: azure/bicep-deploy@01859ee1fa3dd81eca9f2fe88da19faf52a0b532
        with:
          type: deployment
          operation: whatIf
          scope: resourceGroup
          subscription-id: ${{ env.SUB }}
          resource-group-name: ${{ env.RG }}
          template-file: main.json

      - name: 5 stack validate @01859ee (PR 360)
        if: always()
        uses: azure/bicep-deploy@01859ee1fa3dd81eca9f2fe88da19faf52a0b532
        with:
          type: deploymentStack
          operation: validate
          name: repro-stack
          scope: resourceGroup
          subscription-id: ${{ env.SUB }}
          resource-group-name: ${{ env.RG }}
          template-file: main.json
          action-on-unmanage-resources: delete
          deny-settings-mode: none

      - name: 6 deployment create @01859ee (PR 360)
        if: always()
        uses: azure/bicep-deploy@01859ee1fa3dd81eca9f2fe88da19faf52a0b532
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: ${{ env.SUB }}
          resource-group-name: ${{ env.RG }}
          template-file: main.json

      - name: 7 deployment validate @01859ee (PR 360)
        if: always()
        uses: azure/bicep-deploy@01859ee1fa3dd81eca9f2fe88da19faf52a0b532
        with:
          type: deployment
          operation: validate
          scope: resourceGroup
          subscription-id: ${{ env.SUB }}
          resource-group-name: ${{ env.RG }}
          template-file: main.json
